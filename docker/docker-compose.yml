version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: algofight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algofight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - algofight-network

  redis:
    image: redis:7
    container_name: algofight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - algofight-network

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: algofight-piston
    restart: unless-stopped
    # 🔐 Security Hardening Controls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
      - ./package.js:/piston_api/src/package.js
    networks:
      - algofight-network

volumes:
  postgres_data:
  redis_data:
  piston_packages:

networks:
  algofight-network:
    driver: bridge
