version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: algofight-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algofight

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - algofight-network

  redis:
    image: redis:7
    container_name: algofight-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - algofight-network

volumes:
  postgres_data:
  redis_data:

networks:
  algofight-network:
    driver: bridge